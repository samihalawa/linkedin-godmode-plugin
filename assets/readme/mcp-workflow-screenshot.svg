      <path d="M59 218v24" stroke="#385875" stroke-width="3"/>
      <g transform="translate(28 242)"><rect width="566" height="94" rx="16" fill="#13283D"/><circle cx="31" cy="31" r="17" fill="#153E60"/><text x="31" y="37" fill="#58C8FF" font-size="17" text-anchor="middle">2</text><text x="62" y="31" fill="#FFFFFF" font-size="17" font-weight="800">browser_navigate</text><text x="62" y="57" fill="#7FA0BF" font-family="SFMono-Regular, monospace" font-size="14">goto · https://www.linkedin.com/feed/</text><rect x="448" y="23" width="104" height="28" rx="14" fill="#153E60"/><text x="500" y="42" fill="#7DD3FC" font-size="12" font-weight="800" text-anchor="middle">TOOL CALL</text></g>
