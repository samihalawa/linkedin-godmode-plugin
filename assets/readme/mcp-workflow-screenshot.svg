<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Illustrated LinkedIn Godmode MCP workflow</title>
  <desc id="desc">An illustrated sample of a developer agent calling LinkedIn Godmode browser tools beside a LinkedIn feed.</desc>
