<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">LinkedIn Godmode doctor command screenshot</title>
  <desc id="desc">A terminal running linkedin-godmode doctor beside verified local, Browserbase, and Anchor provider status cards.</desc>
