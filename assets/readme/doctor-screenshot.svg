      <text x="54" y="292" fill="#93C5FD">"policy"</text><text x="132" y="292" fill="#D6E4F0">: { </text><text x="164" y="292" fill="#93C5FD">"readOnly"</text><text x="260" y="292" fill="#D6E4F0">: </text><text x="278" y="292" fill="#F9A8D4">false</text><text x="323" y="292" fill="#D6E4F0"> },</text>
      <text x="54" y="324" fill="#93C5FD">"providers"</text><text x="166" y="324" fill="#D6E4F0">: {</text>
      <text x="78" y="356" fill="#93C5FD">"local"</text><text x="146" y="356" fill="#D6E4F0">: { </text><text x="178" y="356" fill="#93C5FD">"ready"</text><text x="245" y="356" fill="#D6E4F0">: </text><text x="263" y="356" fill="#6EE7B7">true</text><text x="299" y="356" fill="#D6E4F0">, </text><text x="319" y="356" fill="#93C5FD">"persistentProfile"</text><text x="505" y="356" fill="#D6E4F0">: </text><text x="523" y="356" fill="#6EE7B7">true</text><text x="558" y="356" fill="#D6E4F0"> },</text>
