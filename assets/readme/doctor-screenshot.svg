      <text x="78" y="420" fill="#93C5FD">"anchor"</text><text x="154" y="420" fill="#D6E4F0">: { </text><text x="186" y="420" fill="#93C5FD">"configured"</text><text x="304" y="420" fill="#D6E4F0">: </text><text x="322" y="420" fill="#F9A8D4">false</text><text x="367" y="420" fill="#D6E4F0"> }</text>
      <text x="54" y="452" fill="#D6E4F0">}</text>
      <text x="34" y="484" fill="#6EE7B7">}</text>
      <text x="34" y="518" fill="#22D3EE">$</text><rect x="58" y="503" width="9" height="20" rx="2" fill="#8B5CF6"/>
