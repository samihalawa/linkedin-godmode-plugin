<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">LinkedIn Godmode runtime architecture</title>
  <desc id="desc">Codex MCP, CLI and HTTP callers share one TypeScript core that connects to local Chrome, Browserbase or Anchor.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#071833" flood-opacity="0.24"/>
    </filter>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A35"/>
      <stop offset="1" stop-color="#0B2D56"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="760" rx="36" fill="url(#background)"/>
  <circle cx="1460" cy="84" r="190" fill="#0A66C2" opacity="0.22"/>
  <circle cx="138" cy="680" r="220" fill="#7C3AED" opacity="0.12"/>
  <path d="M90 118h182" stroke="#22D3EE" stroke-width="8" stroke-linecap="round"/>
  <path d="M1328 672h182" stroke="#FB7185" stroke-width="8" stroke-linecap="round"/>

  <text x="800" y="78" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" text-anchor="middle" letter-spacing="3">ONE CORE · THREE WAYS TO RUN</text>
  <text x="800" y="116" fill="#B9D5F2" font-family="Inter, Arial, sans-serif" font-size="20" text-anchor="middle">Choose the interface and browser provider that fit the job.</text>

  <g filter="url(#shadow)">
    <g transform="translate(105 164)">
      <rect width="360" height="152" rx="24" fill="#FFFFFF"/>
      <rect width="10" height="152" rx="5" fill="#22D3EE"/>
      <rect x="42" y="33" width="64" height="64" rx="18" fill="#E7F9FC"/>
      <path d="M60 53h28M60 65h20M60 77h28" stroke="#0891B2" stroke-width="6" stroke-linecap="round"/>
      <text x="132" y="63" fill="#0B2341" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">Codex MCP</text>
      <text x="132" y="93" fill="#52708D" font-family="Inter, Arial, sans-serif" font-size="17">Nine generic tools</text>
      <text x="42" y="129" fill="#52708D" font-family="Inter, Arial, sans-serif" font-size="15">stdio · structured input · redacted output</text>
    </g>
    <g transform="translate(620 164)">
      <rect width="360" height="152" rx="24" fill="#FFFFFF"/>
      <rect width="10" height="152" rx="5" fill="#8B5CF6"/>
      <rect x="42" y="33" width="64" height="64" rx="18" fill="#F1EAFE"/>
      <path d="M60 56l11 11-11 11M76 80h16" fill="none" stroke="#7C3AED" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="132" y="63" fill="#0B2341" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">CLI + JSONL</text>
      <text x="132" y="93" fill="#52708D" font-family="Inter, Arial, sans-serif" font-size="17">Deterministic execution</text>
      <text x="42" y="129" fill="#52708D" font-family="Inter, Arial, sans-serif" font-size="15">one-shot · batch · reusable sessions</text>
    </g>
    <g transform="translate(1135 164)">
      <rect width="360" height="152" rx="24" fill="#FFFFFF"/>
      <rect width="10" height="152" rx="5" fill="#FB7185"/>
      <rect x="42" y="33" width="64" height="64" rx="18" fill="#FFF0F1"/>
      <circle cx="62" cy="65" r="7" fill="#E11D48"/>
      <circle cx="88" cy="53" r="7" fill="#E11D48"/>
      <circle cx="88" cy="79" r="7" fill="#E11D48"/>
      <path d="M68 62l14-7M68 69l14 7" stroke="#E11D48" stroke-width="5"/>
      <text x="132" y="63" fill="#0B2341" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">HTTP + Agent</text>
      <text x="132" y="93" fill="#52708D" font-family="Inter, Arial, sans-serif" font-size="17">Requests or explicit tasks</text>
      <text x="42" y="129" fill="#52708D" font-family="Inter, Arial, sans-serif" font-size="15">capture · replay · provider tasks</text>
    </g>
  </g>

  <path d="M285 316v58h515" fill="none" stroke="#4C84B6" stroke-width="4"/>
  <path d="M800 316v58" fill="none" stroke="#4C84B6" stroke-width="4"/>
  <path d="M1315 316v58H800" fill="none" stroke="#4C84B6" stroke-width="4"/>
  <circle cx="800" cy="374" r="9" fill="#FBBF24"/>

  <g filter="url(#shadow)" transform="translate(310 374)">
    <rect width="980" height="178" rx="28" fill="#0A66C2"/>
    <rect x="20" y="20" width="940" height="138" rx="20" fill="#0B5AAF" stroke="#5CB6FF" stroke-opacity="0.55" stroke-width="2"/>
    <text x="490" y="63" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle">SHARED TYPESCRIPT CORE</text>
    <g font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
      <g transform="translate(63 91)"><rect width="190" height="45" rx="13" fill="#E6F7FF"/><text x="95" y="29" fill="#075985">SESSION + PAGES</text></g>
      <g transform="translate(284 91)"><rect width="190" height="45" rx="13" fill="#EDE9FE"/><text x="95" y="29" fill="#5B21B6">ACT + CAPTURE</text></g>
      <g transform="translate(505 91)"><rect width="190" height="45" rx="13" fill="#CCFBF1"/><text x="95" y="29" fill="#0F766E">NETWORK</text></g>
      <g transform="translate(726 91)"><rect width="190" height="45" rx="13" fill="#FFE4E6"/><text x="95" y="29" fill="#BE123C">HTTP + TASKS</text></g>
    </g>
  </g>

  <path d="M800 552v42M800 594H300v38M800 594v38M800 594h500v38" fill="none" stroke="#4C84B6" stroke-width="4"/>
  <circle cx="800" cy="594" r="9" fill="#FBBF24"/>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <g transform="translate(105 632)">
      <rect width="390" height="92" rx="22" fill="#DDFBF5"/>
      <circle cx="55" cy="46" r="24" fill="#14B8A6"/>
      <path d="M45 45l8 8 14-17" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="95" y="42" fill="#10423F" font-size="22" font-weight="800">Local Chrome</text>
      <text x="95" y="66" fill="#48736F" font-size="15">persistent profile · default</text>
    </g>
    <g transform="translate(605 632)">
      <rect width="390" height="92" rx="22" fill="#EEE8FF"/>
      <circle cx="55" cy="46" r="24" fill="#8B5CF6"/>
      <path d="M43 48c10-22 18 22 28 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <text x="95" y="42" fill="#3F2670" font-size="22" font-weight="800">Browserbase</text>
      <text x="95" y="66" fill="#6D5A8C" font-size="15">cloud browser · CDP</text>
    </g>
    <g transform="translate(1105 632)">
      <rect width="390" height="92" rx="22" fill="#FFF0E8"/>
      <circle cx="55" cy="46" r="24" fill="#F97360"/>
      <path d="M44 58l11-27 11 27M49 49h13" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="95" y="42" fill="#6C3026" font-size="22" font-weight="800">Anchor</text>
      <text x="95" y="66" fill="#8F655D" font-size="15">cloud browser · web tasks</text>
    </g>
  </g>
</svg>
